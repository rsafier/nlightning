syntax = "proto3";
option csharp_namespace = "NLightning.Signing.Contracts";
package nlightning.signing.v1;
// Versioned fixed operation IDs; JSON payloads use the explicit SignerWire converters.
service SignerRpc {
  rpc Execute(SigningRequest) returns (SigningResponse);
  // Never executes the request. Supply its exact original envelope to bind the lookup to its payload.
  rpc Reconcile(SigningRequest) returns (ReconciliationResponse);
}
message SigningRequest { uint32 version = 1; string request_id = 2; uint32 operation = 3; bytes payload = 4; string node_id = 5; string owner_id = 6; string signer_id = 7; string network = 8; }
message SigningResponse { bytes payload = 1; }

// UNKNOWN means an allocation may have persisted without its response. Never resend that request ID.
// NOT_FOUND is not evidence that an unsupported or ephemeral operation did not execute.
enum RequestOutcome {
  NOT_FOUND = 0;
  COMPLETED = 1;
  UNKNOWN = 2;
  INVALIDATED = 3;
  UNSUPPORTED = 4;
}
message ReconciliationResponse { RequestOutcome outcome = 1; SigningResponse response = 2; }
