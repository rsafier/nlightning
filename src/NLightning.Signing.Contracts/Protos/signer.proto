syntax = "proto3";
option csharp_namespace = "NLightning.Signing.Contracts";
package nlightning.signing.v1;
// Versioned fixed operation IDs; JSON payloads use the explicit SignerWire converters.
service SignerRpc { rpc Execute(SigningRequest) returns (SigningResponse); }
message SigningRequest { uint32 version = 1; string request_id = 2; uint32 operation = 3; bytes payload = 4; }
message SigningResponse { bytes payload = 1; }
