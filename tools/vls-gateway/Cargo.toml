[package]
name = "nlightning-vls-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vls-core = { path = "../source/vls-core", default-features = false, features = ["std"] }
vls-persist = { path = "../source/vls-persist", default-features = false, features = ["std", "redb-kvv"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = "1"

[[bin]]
name = "nlightning-vls-gateway"
path = "main.rs"

[[test]]
name = "gateway_process"
path = "process_test.rs"

[profile.dev]
debug = 0
