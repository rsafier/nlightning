# Live smoke of the BOLT 10 DNS seeds (NL-544): runs the one Explicit, Category=Live test against the real seeds
# (test/NLightning.Infrastructure.Bitcoin.Tests/Bootstrap/DnsSeedLiveTests.cs) on a schedule, so a change in the
# seeds' answers is caught without a manual run. Deliberately not part of the PR gate (dotnet.yml): it needs the
# internet, its seeds are outside our control, and a PR must never fail on them.
name: BOLT 10 Live Seeds (Scheduled)
on:
  schedule:
    # Weekly, Mondays 03:41 UTC (off the top of the hour)
    - cron: "41 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns-seed-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # net10.0 (LTS) and net11.0: the net11.0 target is built only by SDK 11 (src/Directory.Build.props), which
      # global.json (rollForward latestMajor) picks when installed. Drop dotnet-quality once .NET 11 is GA.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build
        run: dotnet build --configuration Release -p:MSBuildWarningsAsMessages=MSB4121

      # The documented explicit run (CLAUDE.md): the xUnit v3 runner arguments go after `--`
      - name: Run the live BOLT 10 seed smoke test
        run: >-
          dotnet test test/NLightning.Infrastructure.Bitcoin.Tests --no-build --configuration Release
          --filter "Category=Live" -f net10.0 --logger trx --verbosity normal
          -- xUnit.Explicit=only

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bolt10-live-seeds-trx
          path: test/NLightning.Infrastructure.Bitcoin.Tests/TestResults/**
          if-no-files-found: ignore
          retention-days: 30